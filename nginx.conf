server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Nén text để tải nhanh
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml;

    # Header bảo mật cơ bản
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # index.html: không cache lâu để sửa xong là thấy ngay
    # (dùng expires thay cho add_header để không mất các header bảo mật ở trên)
    location = /index.html {
        expires -1;
    }

    # Ảnh chia sẻ: cache 7 ngày
    location ~* \.(jpg|jpeg|png|svg|ico)$ {
        expires 7d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
